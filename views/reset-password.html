<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Daffodils Montessori</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Open+Sans:wght@300;400;500;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo">
        <span class="logo-icon">🌼</span>
        <div class="logo-text">
          <span class="logo-name">Daffodils</span>
          <span class="logo-tagline">Montessori</span>
        </div>
      </a>
      <ul class="nav-menu" id="navMenu">
        <li><a href="/">Home</a></li>
        <li><a href="/login">Login</a></li>
      </ul>
    </div>
  </nav>

  <section class="section login-section">
    <div class="container">
      <div class="login-wrapper">
        <div class="login-card">
          <!-- Forgot Password Form (default) -->
          <div id="forgotSection">
            <div class="login-header">
              <span class="logo-icon" style="font-size:3rem;">🌼</span>
              <h2>Forgot Password</h2>
              <p>Enter your email and we'll send you a reset link.</p>
            </div>
            <form id="forgotForm" class="contact-form">
              <div class="form-group">
                <label for="forgotEmail">Email Address</label>
                <input type="email" id="forgotEmail" name="email" placeholder="your@email.com" required>
              </div>
              <button type="submit" class="btn btn-primary btn-large btn-full">
                <i class="fas fa-paper-plane"></i> Send Reset Link
              </button>
              <div id="forgotMessage" class="form-message"></div>
            </form>
            <div class="login-footer">
              <p>Remember your password?</p>
              <a href="/login"><i class="fas fa-sign-in-alt"></i> Back to Login</a>
            </div>
          </div>

          <!-- Reset Password Form (shown when token is present) -->
          <div id="resetSection" style="display:none;">
            <div class="login-header">
              <span class="logo-icon" style="font-size:3rem;">🌼</span>
              <h2>Set New Password</h2>
              <p>Enter your new password below.</p>
            </div>
            <form id="resetForm" class="contact-form">
              <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" name="password" placeholder="At least 6 characters" required minlength="6">
              </div>
              <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password" required minlength="6">
              </div>
              <button type="submit" class="btn btn-primary btn-large btn-full">
                <i class="fas fa-lock"></i> Reset Password
              </button>
              <div id="resetMessage" class="form-message"></div>
            </form>
            <div class="login-footer">
              <a href="/login"><i class="fas fa-sign-in-alt"></i> Back to Login</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="/js/main.js"></script>
  <script>
    // Check if we have a reset token in URL
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (token) {
      document.getElementById('forgotSection').style.display = 'none';
      document.getElementById('resetSection').style.display = 'block';
    }

    // Forgot password form
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msgEl = document.getElementById('forgotMessage');
      const btn = e.target.querySelector('button[type="submit"]');
      const orig = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
      btn.disabled = true;

      try {
        const resp = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('forgotEmail').value }),
        });
        const result = await resp.json();
        msgEl.className = 'form-message success';
        msgEl.textContent = result.message || 'If an account with that email exists, a reset link has been sent.';
      } catch {
        msgEl.className = 'form-message error';
        msgEl.textContent = 'Something went wrong. Please try again.';
      }

      btn.innerHTML = orig;
      btn.disabled = false;
    });

    // Reset password form
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msgEl = document.getElementById('resetMessage');
      const newPass = document.getElementById('newPassword').value;
      const confirmPass = document.getElementById('confirmPassword').value;

      if (newPass !== confirmPass) {
        msgEl.className = 'form-message error';
        msgEl.textContent = 'Passwords do not match.';
        return;
      }

      const btn = e.target.querySelector('button[type="submit"]');
      const orig = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting...';
      btn.disabled = true;

      try {
        const resp = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: newPass }),
        });
        const result = await resp.json();
        if (result.success) {
          msgEl.className = 'form-message success';
          msgEl.textContent = result.message;
          setTimeout(() => { window.location.href = '/login'; }, 2000);
        } else {
          msgEl.className = 'form-message error';
          msgEl.textContent = result.error;
        }
      } catch {
        msgEl.className = 'form-message error';
        msgEl.textContent = 'Something went wrong. Please try again.';
      }

      btn.innerHTML = orig;
      btn.disabled = false;
    });
  </script>
</body>
</html>
