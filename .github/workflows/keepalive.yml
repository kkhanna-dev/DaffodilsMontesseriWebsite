# Pings Supabase twice a week so the free project does not pause.
# Needs repo secrets SUPABASE_URL and SUPABASE_ANON_KEY (see SETUP.md step 8).
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 16 * * 1,4"   # Mon + Thu, 9:17 AM Pacific
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets not set yet; skipping."
            exit 0
          fi
          curl -fsS "$SUPABASE_URL/rest/v1/programs?select=id&limit=1" -H "apikey: $SUPABASE_ANON_KEY" > /dev/null
          echo "Supabase answered."
